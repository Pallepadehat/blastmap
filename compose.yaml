services:
  app:
    build: .
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    # No restart policy: a bad environment should exit and stay exited with
    # its message on screen, not loop.

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: blastmap
      POSTGRES_PASSWORD: blastmap
      POSTGRES_DB: blastmap
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blastmap -d blastmap"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
